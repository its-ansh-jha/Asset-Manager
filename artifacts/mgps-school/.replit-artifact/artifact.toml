kind = "web"
previewPath = "/"
title = "Maa Gayatri Public School"
description = "A premium, responsive school website for Maa Gayatri Public School in Muzaffarpur, helping parents understand the school, explore academics, view the learning environment, and contact the school about admissions."
version = "1.0.0"
id = "artifacts/mgps-school"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26271

[services.development]
run = "pnpm --filter @workspace/mgps-school run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mgps-school", "run", "build" ]
serve = "static"
publicDir = "artifacts/mgps-school/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26271"
BASE_PATH = "/"
